[workspace]
resolver = "2"
members = [
    "crates/tokmesh-core",
    "crates/tokmesh-cli",
    "crates/tokmesh",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Tokmesh contributors"]
license = "MIT"
repository = "https://github.com/xxxbrian/tokmesh"
homepage = "https://github.com/xxxbrian/tokmesh"

[workspace.dependencies]
# Internal crates (path for local dev; version required for crates.io publish)
tokmesh-core = { path = "crates/tokmesh-core", version = "0.1.1" }
tokmesh-cli = { path = "crates/tokmesh-cli", version = "0.1.1" }

# Parallelism
rayon = "1.10"

# JSON parsing (with SIMD acceleration)
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# TOML config parsing
toml = "0.8"

# File system traversal
walkdir = "2"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Error handling
thiserror = "2"
anyhow = "1.0"
libc = "0.2"

# HTTP client (async)
# rustls avoids system OpenSSL, which breaks zig/cross Linux release builds.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

# For disk caching (XDG paths)
dirs = "5"

# SQLite database support (bundled for cross-compilation)
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"

# Lazy static initialization
once_cell = "1"

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# TUI framework
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Terminal cell width of a grapheme. ratatui lays tables out in cells and
# already depends on this crate to do it, so measuring table content with
# anything else (`chars().count()`) disagrees with the solver on CJK and emoji.
unicode-width = "0.2"

# Grapheme cluster boundaries. `char_indices()` only respects UTF-8 character
# boundaries, so truncating on it splits a flag (two regional indicators) or a
# ZWJ family emoji mid-sequence and renders garbage. Already in the tree
# transitively, so this adds no new dependency.
unicode-segmentation = "1.12"

# Table output for non-TUI mode
comfy-table = "7"

# Terminal colors
colored = "2"

# Progress indicators
indicatif = "0.17"

# Tracing/logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
fs2 = "0.4"

# Trae iCubeAuthInfo decryption: AES-128-CBC + base64
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
base64 = "0.22"

# Clipboard
arboard = "3"

# Unix signal handling
signal-hook = "0.3"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
