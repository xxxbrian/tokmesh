# Tokmesh upstream baselines (reviewed tips). Not auto-merged.
# Hard-fork reference pins: record which upstream commits we reviewed when
# adopting code. Update this file when you intentionally re-base research
# clones or pull a new upstream tip into consideration.
# Format: simple key/value for humans and scripts.

[tokscale]
repo = "https://github.com/junhoyeo/tokscale"
commit = "e80db478af11408c6dd3436e40dee9e7c0d84a23"
# Package version stays the lock pin (4.7.0), not tokmesh 0.1.3 or tokscale 4.15.0.
# Last in-scope commit ported: Cursor cache-move follow-up. Later tokscale
# commits in the window (Hindsight, native-tls, submit fold, website/CI/moderation)
# were reviewed and not taken.
version = "4.7.0"
subject = "fix(cursor): stop discarding failed cache moves on account switch (#1258)"
role = "local-baseline"
reviewed = "2026-09-03"

[tokens]
repo = "https://github.com/missuo/tokens"
commit = "75aba190695c9de5f2695d9baba6afd3c8cb63f8"
# Package version at that commit. Submit to tokens.ci reports this as meta.version.
# Files were copied from this HEAD (Grok unified dual-write itself is skipped).
version = "27.0.1"
subject = "Revert Merge pull request #56 from thedavidweng/fix/grok-unified-log"
role = "submit-hardening-and-parser-picks"
reviewed = "2026-09-03"

