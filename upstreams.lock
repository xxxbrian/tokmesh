# Tokmesh upstream baselines (reviewed tips). Not auto-merged.
# Hard-fork reference pins: record which upstream commits we reviewed when
# adopting code. Update this file when you intentionally re-base research
# clones or pull a new upstream tip into consideration.
# Format: simple key/value for humans and scripts.

[tokscale]
repo = "https://github.com/junhoyeo/tokscale"
commit = "62ca1eb1677556972ba963fdfa3a41ab23c1eb4b"
# Package version at that commit (`[workspace.package] version`). Submit to
# tokscale.ai reports this as meta.version (cliVersion), not tokmesh's own semver.
# Files were copied from this HEAD; keep reporting lock version 4.7.0 (do not
# report tokscale 4.14.0 / website / OG / branding).
version = "4.7.0"
subject = "style(tui): collapse a nested condition rustfmt and clippy disagreed over"
role = "local-baseline"
reviewed = "2026-08-27"

[tokens]
repo = "https://github.com/missuo/tokens"
commit = "75aba190695c9de5f2695d9baba6afd3c8cb63f8"
# Package version at that commit. Submit to tokens.ci reports this as meta.version.
# Files were copied from this HEAD (Grok unified dual-write itself is skipped).
version = "27.0.1"
subject = "Revert Merge pull request #56 from thedavidweng/fix/grok-unified-log"
role = "submit-hardening-and-parser-picks"
reviewed = "2026-08-27"

[adopted.tokens]
bucket_tz = "pinned IANA date bucketing"
grok_turn_completed = "sessions/grok.rs turn_completed usage path"
scanner_retain_since = "ScanResult::retain_files_modified_since"
auth_hardening = "poll clamps, optional status, 0600 repair"
tokensci_protocol = "clientManifest, provenance, --replace"
cline_cli_parser = "VS Code + CLI Cline (do not dual-register tokscale Cline)"
reasonix_stats_jsonl = "Reasonix stats JSONL parser"
freebuff_parser = "Freebuff/manicode channel parser"
fx_usage_v2 = "fx usage-v2 parser (tokscale's three fx fixes layered on top)"
kimi_blank_env = "KIMI_CODE_HOME trim-empty fallback + kimi-work roots via kimi-code parser"

[adopted.tokscale]
daily_2026_08_27_clients = "11 new ClientIds + scanner special cases (senpi extra roots, prime-agent artifacts, cherry v2, freebuff/manicode share, mcode headless, kimi-work roots)"
daily_2026_08_27_cli = "ClientFilter variants including NineRouter->Gjc, TUI display names"
daily_2026_08_27_pricing_aliases = "kimi-for-coding, k2d6-agent/k3-agent, minimax-m3, daybreak-blue, claude-opus-4-0/claude-opus-41"
daily_2026_08_27_copilot = "copilot.rs for_each_json_line + desktop/vscode full chain"
daily_2026_08_27_hang = "lossy_lines / for_each_json_line / sqlite_for_each_row_on (kimi, copilot, synthetic, grok)"

[kept.tokmesh]
opencode_fast = "OpenCode gpt-*-fast identity (parser_version OpenCode=2)"
grok_build = "Grok -build model identity; grok parser stays updates.jsonl (no unified dual-source)"
rustls = "reqwest rustls-tls, no native-tls"
hermes_per_model = true

[kept.tokscale]
full_tui_reports = true
hermes_per_model = true
tests = true
opencode_fast_grok_build_pricing = true
rustls_tls = true
compact_client_column = true
